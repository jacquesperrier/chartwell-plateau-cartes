<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonia Dri — Chartwell Du Plateau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --base: #F4F1EA;
    --surface: #FFFFFF;
    --blue: #1F6FC5;
    --bourgogne: #722F37;
    --brown: #5C4632;
    --text: #2B2A28;
    --text-dim: #7A756C;
    --accent-gradient: linear-gradient(90deg, #1F6FC5 0%, #722F37 50%, #5C4632 100%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body{
    background: var(--base);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .stage{
    width: 100%;
    max-width: 380px;
    perspective: 1600px;
  }

  .card{
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 7.4;
    transform-style: preserve-3d;
    transition: transform 0.85s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }

  .card.flipped{ transform: rotateY(180deg); }

  .face{
    position: absolute;
    inset: 0;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid #E4E0D6;
    box-shadow: 0 24px 50px -20px rgba(43,42,40,0.25);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .face.back{ transform: rotateY(180deg); }

  .top-bar{
    height: 6px;
    background: var(--accent-gradient);
  }

  .mark{
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .mark-glyph{
    width: 46px;
    height: auto;
    flex-shrink: 0;
    object-fit: contain;
  }

  .mark-text{
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
  }

  .front-content{
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 30px 30px 24px;
    position: relative;
    overflow: hidden;
  }

  .watermark{
    position: absolute;
    top: -30px;
    right: -10px;
    font-family: 'Newsreader', serif;
    font-size: 220px;
    font-weight: 500;
    line-height: 1;
    color: rgba(114, 47, 55, 0.06);
    pointer-events: none;
    user-select: none;
  }

  .name-block{ margin-top: auto; }

  .name{
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.1;
    color: var(--text);
  }

  .title{
    margin-top: 10px;
    font-size: 14px;
    color: var(--bourgogne);
    font-weight: 500;
  }

  .divider{
    margin: 22px 0 16px;
    height: 1px;
    background: #E4E0D6;
  }

  .contact{
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
  }

  .contact a{
    color: var(--text);
    text-decoration: none;
    opacity: 0.85;
  }

  .contact a:hover{ opacity: 1; }

  .contact .addr{
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.5;
  }

  .footer-bar{
    padding: 14px 30px 16px;
    border-top: 1px solid #E4E0D6;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .company{
    font-size: 13px;
    color: var(--text);
  }
  .company b{ color: var(--blue); }
  .company i{ color: var(--bourgogne); font-style: normal; }

  .flip-hint{ font-size: 11px; color: var(--text-dim); }

  .back-content{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    gap: 18px;
  }

  .qr-wrap{
    background: #FFFFFF;
    padding: 14px;
    border-radius: 10px;
    line-height: 0;
    border: 1px solid #E4E0D6;
  }

  .qr-caption{
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
    max-width: 220px;
    line-height: 1.5;
  }

  .save-btn{
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--bourgogne);
    color: var(--bourgogne);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 11px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .save-btn:hover{ background: var(--bourgogne); color: #fff; }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>

<script>
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Dri;Sonia;;;",
    "FN:Sonia Dri",
    "ORG:Chartwell Du Plateau",
    "TITLE:Conseillère en location",
    "TEL;TYPE=CELL:+1-819-588-4108",
    "TEL;TYPE=WORK,VOICE:+1-819-771-1245;ext=6003",
    "EMAIL;TYPE=WORK:sdri@chartwell.com",
    "ADR;TYPE=WORK:;;245, boul. du Plateau;Gatineau;QC;J9A 0H9;Canada",
    "URL:https://chartwell.com",
    "END:VCARD"
  ].join("\n");

  new QRCode(document.getElementById("qrcode"), {
    text: vcard,
    width: 168,
    height: 168,
    colorDark: "#2B2A28",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.M
  });

  const card = document.getElementById("card");
  card.addEventListener("click", (e) => {
    if (e.target.closest("#save-btn") || e.target.closest("a")) return;
    card.classList.toggle("flipped");
  });

  document.getElementById("save-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    const blob = new Blob([vcard], { type: "text/vcard" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "sonia-dri-chartwell.vcf";
    link.click();
    URL.revokeObjectURL(url);
  });
</script>
